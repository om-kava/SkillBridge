{% extends 'base.html' %}

{% block title %}Create Account{% endblock %}

{% block styles %}
<style>
  .auth-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .auth-card {
    width: 100%;
    max-width: 460px;
    padding: 44px 40px;
    position: relative;
    overflow: hidden;
    animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .auth-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--bone), var(--olive-drab), var(--floral-white));
  }

  .brand-header {
    text-align: center;
    margin-bottom: 30px;
  }

  .brand-icon {
    width: 60px;
    height: 60px;
    background: rgba(86, 84, 73, 0.3);
    border: 1px solid var(--bone);
    border-radius: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    color: var(--floral-white);
    margin-bottom: 18px;
    box-shadow: 0 0 25px rgba(216, 207, 188, 0.2);
  }

  .brand-title {
    font-family: var(--font-serif);
    font-size: 32px;
    font-weight: 600;
    color: var(--floral-white);
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }

  .brand-subtitle {
    font-size: 14px;
    color: var(--bone);
    opacity: 0.8;
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--bone);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .input-wrapper {
    position: relative;
  }

  .input-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--olive-light);
    font-size: 14px;
    transition: color 0.2s ease;
  }

  .form-input {
    width: 100%;
    padding: 13px 16px 13px 44px;
    background: rgba(17, 18, 13, 0.8);
    border: 1px solid var(--border-olive);
    border-radius: 12px;
    color: var(--floral-white);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: all 0.25s ease;
  }

  .form-input:focus {
    border-color: var(--bone);
    background: rgba(28, 29, 25, 0.95);
    box-shadow: 0 0 0 3px var(--bone-glow);
  }

  .form-input:focus + .input-icon {
    color: var(--bone);
  }

  .btn-submit {
    width: 100%;
    padding: 15px;
    background: var(--bone);
    border: none;
    border-radius: 12px;
    color: var(--smoky-black);
    font-family: var(--font-sans);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(216, 207, 188, 0.2);
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 10px;
  }

  .btn-submit:hover {
    background: var(--floral-white);
    transform: translateY(-2px);
    box-shadow: 0 14px 35px rgba(255, 251, 244, 0.3);
  }

  .btn-submit:active {
    transform: translateY(0);
  }

  .alert-danger {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #fca5a5;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .auth-footer {
    text-align: center;
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--border-olive);
    font-size: 14px;
    color: var(--bone);
    opacity: 0.8;
  }

  .auth-footer a {
    color: var(--floral-white);
    text-decoration: none;
    font-weight: 600;
    border-bottom: 1px solid var(--bone);
    transition: all 0.2s ease;
  }

  .auth-footer a:hover {
    color: var(--bone);
    border-bottom-color: transparent;
  }

  @keyframes slideUpFade {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="glass-card auth-card">
    <div class="brand-header">
      <div class="brand-icon">
        <i class="fa-solid fa-sparkles"></i>
      </div>
      <h1 class="brand-title">Create Account</h1>
      <p class="brand-subtitle">Join our editorial AI platform</p>
    </div>

    {% if error_message %}
      <div class="alert-danger">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>{{ error_message }}</span>
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <div class="input-wrapper">
          <input type="text" class="form-input" id="username" name="username" placeholder="Choose a username" required autocomplete="username">
          <i class="fa-solid fa-user input-icon"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <div class="input-wrapper">
          <input type="email" class="form-input" id="email" name="email" placeholder="name@example.com" required autocomplete="email">
          <i class="fa-solid fa-envelope input-icon"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password1">Password</label>
        <div class="input-wrapper">
          <input type="password" class="form-input" id="password1" name="password1" placeholder="••••••••" required autocomplete="new-password">
          <i class="fa-solid fa-lock input-icon"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password2">Confirm Password</label>
        <div class="input-wrapper">
          <input type="password" class="form-input" id="password2" name="password2" placeholder="••••••••" required autocomplete="new-password">
          <i class="fa-solid fa-shield-halved input-icon"></i>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <span>Create Account</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
