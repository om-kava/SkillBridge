<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{% block title %}Aesthetic AI Assistant{% endblock %} | Django Chatbot</title>
    
    <!-- Google Fonts: Playfair Display (Serif), Plus Jakarta Sans (Sans), Fira Code (Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Marked.js for Structured Markdown Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Highlight.js for Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <!-- Luxury Color System & Styling Tokens -->
    <style>
      :root {
        /* User exact color palette */
        --smoky-black: #11120D;
        --olive-drab: #565449;
        --bone: #D8CFBC;
        --floral-white: #FFFBF4;
        
        /* Derived luxury shades */
        --smoky-card: #181913;
        --smoky-glass: rgba(17, 18, 13, 0.85);
        --olive-light: #6E6B5E;
        --olive-glass: rgba(86, 84, 73, 0.25);
        --bone-glow: rgba(216, 207, 188, 0.25);
        --border-olive: rgba(86, 84, 73, 0.4);
        --border-bone: rgba(216, 207, 188, 0.3);
        
        /* Typography */
        --font-serif: 'Playfair Display', Georgia, serif;
        --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
        --font-code: 'Fira Code', monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body, html {
        height: 100%;
        font-family: var(--font-sans);
        background-color: var(--smoky-black);
        color: var(--bone);
        overflow-x: hidden;
      }

      /* Ambient Background Orbs */
      .ambient-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        pointer-events: none;
        overflow: hidden;
      }

      .glow-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(140px);
        opacity: 0.25;
        animation: floatGlow 14s ease-in-out infinite alternate;
      }

      .glow-orb-1 {
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, var(--olive-drab) 0%, transparent 70%);
        top: -120px;
        left: -100px;
      }

      .glow-orb-2 {
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, var(--bone) 0%, transparent 70%);
        bottom: -200px;
        right: -100px;
        animation-delay: -7s;
        opacity: 0.15;
      }

      @keyframes floatGlow {
        0% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(40px, 30px) scale(1.1); }
        100% { transform: translate(-30px, 50px) scale(0.95); }
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(86, 84, 73, 0.4);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--bone);
      }

      /* Glass Panels */
      .glass-card {
        background: var(--smoky-glass);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--border-olive);
        border-radius: 20px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
      }

      /* Typography Serif Classes */
      .font-serif {
        font-family: var(--font-serif);
      }

      /* Basic Navbar for Auth & Shared Pages */
      .auth-navbar {
        background: var(--smoky-glass);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--border-olive);
        padding: 14px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .auth-nav-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        cursor: pointer;
      }

      .auth-brand-icon {
        width: 40px;
        height: 40px;
        background: rgba(86, 84, 73, 0.4);
        border: 1px solid var(--bone);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--floral-white);
        font-size: 18px;
        box-shadow: 0 0 20px rgba(216, 207, 188, 0.2);
        transition: transform 0.2s ease;
      }
      .auth-nav-brand:hover .auth-brand-icon {
        transform: scale(1.05);
      }

      .auth-brand-name {
        font-family: var(--font-serif);
        font-size: 22px;
        font-weight: 700;
        color: var(--floral-white);
        letter-spacing: -0.3px;
      }

      .auth-nav-links {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .auth-nav-item {
        color: var(--bone);
        text-decoration: none;
        font-size: 13.5px;
        font-weight: 500;
        opacity: 0.85;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }

      .auth-nav-item:hover {
        color: var(--floral-white);
        opacity: 1;
        text-shadow: 0 0 10px rgba(255, 251, 244, 0.3);
      }

      .auth-nav-btn {
        padding: 9px 20px;
        background: var(--bone);
        color: var(--smoky-black);
        border-radius: 30px;
        font-size: 13.5px;
        font-weight: 700;
        text-decoration: none;
        transition: all 0.25s ease;
        box-shadow: 0 4px 15px rgba(216, 207, 188, 0.25);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .auth-nav-btn:hover {
        background: var(--floral-white);
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(255, 251, 244, 0.35);
      }

      @media (max-width: 640px) {
        .auth-navbar {
          padding: 12px 16px;
        }
        .auth-nav-links {
          gap: 10px;
        }
        .auth-nav-item {
          font-size: 12.5px;
        }
        .auth-nav-btn {
          padding: 7px 14px;
          font-size: 12.5px;
        }
      }
    </style>
    {% block styles %}{% endblock %}
  </head>
  <body>
    <!-- Background Ambient Orbs -->
    <div class="ambient-bg">
      <div class="glow-orb glow-orb-1"></div>
      <div class="glow-orb glow-orb-2"></div>
    </div>

    <!-- Basic Navbar for Auth & Extension Pages -->
    {% block navbar %}
    <nav class="auth-navbar">
      <a href="{% if user.is_authenticated %}{% url 'sb_dashboard' %}{% else %}{% url 'sb_landing' %}{% endif %}" class="auth-nav-brand" title="SkillBridge Home">
        <div class="auth-brand-icon">
          <i class="fa-solid fa-compass-drafting"></i>
        </div>
        <span class="auth-brand-name">SkillBridge</span>
      </a>

      <div class="auth-nav-links">
        <a href="{% url 'sb_landing' %}" class="auth-nav-item"><i class="fa-solid fa-house"></i> Home</a>
        <a href="{% url 'sb_about' %}" class="auth-nav-item"><i class="fa-solid fa-circle-info"></i> About</a>
        <a href="{% url 'chatbot' %}" class="auth-nav-item"><i class="fa-solid fa-robot"></i> AI Assistant</a>
        {% if user.is_authenticated %}
          <a href="{% url 'sb_dashboard' %}" class="auth-nav-item"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
          <a href="{% url 'sb_logout' %}" class="auth-nav-item" style="color: #fca5a5;"><i class="fa-solid fa-right-from-bracket"></i> Sign Out</a>
        {% else %}
          <a href="{% url 'sb_login' %}" class="auth-nav-item">Sign In</a>
          <a href="{% url 'sb_register' %}" class="auth-nav-btn">Get Started <i class="fa-solid fa-arrow-right"></i></a>
        {% endif %}
      </div>
    </nav>
    {% endblock %}

    {% block content %}{% endblock %}

    {% block scripts %}{% endblock %}
  </body>
</html>
